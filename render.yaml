services:
  - type: web
    name: gungong
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FIRESTORE_PROJECT_ID
        value: gungong-6502f
      - key: FIRESTORE_DATABASE_ID
        value: "(default)"
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/service-account.json
      - key: DEBUG
        value: "false"
      - key: SEED_MOCK_DATA
        value: "false"
